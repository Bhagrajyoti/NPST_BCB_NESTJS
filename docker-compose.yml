services:
  mysql:
    image: mysql:8.0
    container_name: npst-bcb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: identity_billpay_admin
      MYSQL_USER: bcb_user
      MYSQL_PASSWORD: bcb_pass
    ports:
      - '0.0.0.0:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 15
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

  identity-billpay-admin-service:
    build:
      context: ./backend/nestjs/identity-billpay-admin-service
      dockerfile: Dockerfile
    container_name: npst-bcb-api
    env_file:
      - ./backend/nestjs/identity-billpay-admin-service/.env.docker
    ports:
      - '0.0.0.0:3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
